# Local PostgreSQL for development. Start it with:  docker compose up -d
services:
  postgres:
    image: postgres:17
    container_name: skatepod-postgres
    environment:
      POSTGRES_DB: skatepod
      POSTGRES_USER: skatepod
      POSTGRES_PASSWORD: skatepod
    ports:
      - "5432:5432"
    volumes:
      - skatepod-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skatepod -d skatepod"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  skatepod-data:
