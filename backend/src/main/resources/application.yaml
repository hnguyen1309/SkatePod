spring:
  application:
    name: skatepod-api
  datasource:
    # Defaults match compose.yaml. Override with env vars when deploying.
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/skatepod}
    username: ${DATABASE_USERNAME:skatepod}
    password: ${DATABASE_PASSWORD:skatepod}
  jpa:
    # Flyway owns the schema; Hibernate only checks that entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  mvc:
    # Errors come back as standard JSON "problem details".
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # Uploaded music files (POST /api/music) can be up to 20 MB, like MusicFileService.MAX_BYTES.
      max-file-size: 20MB
      max-request-size: 21MB

server:
  port: ${PORT:8080}

skatepod:
  music:
    # Where uploaded music files are kept (relative to the folder the backend runs in, so backend/uploads/music).
    # Set MUSIC_DIR when deploying, to a folder that survives restarts.
    dir: ${MUSIC_DIR:uploads/music}
