# Home: greeting, today's schedule, the "Coming up" list (search finds a student and their next
# lesson, a row opens the student) and links to other tabs.
appId: host.exp.Exponent
name: Dashboard
tags: [smoke]
---
- runFlow: ../subflows/start.yaml

# 1. Home shows the greeting, today's schedule and Coming up, with no separate student list.
- assertVisible: "Good (morning|afternoon|evening), Mia"
- assertVisible: "Today’s schedule"
- assertVisible: "Coming up"
- assertNotVisible: "Your students.*"

# 2. Search narrows Coming up to the matching student, with their level and next lesson.
- tapOn: "Search students..."
- inputText: "Lily"
- assertVisible: ".*Lily Kim, Silver Freeskate.*"
- assertNotVisible: ".*Sofia Chen.*"
- assertNotVisible: ".*Jonah Reed.*"
- eraseText: 10
- inputText: "zzz"
- assertVisible: "No students match “zzz”."
- eraseText: 10
- pressKey: Enter

# 3. Tapping a row opens that student on the Students tab.
- tapOn: "Search students..."
- inputText: "Emma"
- pressKey: Enter
- tapOn: ".*Emma Miller.*"
- assertVisible: "Training snapshot"
- tapOn: "Close"

# 4. The "Calendar" link goes to Calendar.
- tapOn: "Home"
- tapOn:
    text: "Calendar"
    index: 0
- assertVisible: "Schedule"

# 5. The header "Add lesson" on Home opens the lesson editor on the Calendar.
- tapOn: "Home"
- tapOn: "Add lesson"
- assertVisible: "Schedule lesson"
- tapOn: "Cancel"
