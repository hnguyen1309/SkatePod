# Calendar: schedule a weekly lesson, preview it, edit it, block a double booking, delete it.
appId: host.exp.Exponent
name: Calendar lessons
tags: [regression]
---
- runFlow: ../subflows/start.yaml
- tapOn: "Calendar"
- assertVisible: "Schedule"

# Week navigation and Today.
- tapOn: "Next week"
- tapOn: "Previous week"
- tapOn: "Today"

# Zoom out and back in with the − / + buttons (pinching can't be scripted here).
- tapOn: "Zoom out"
- tapOn: "Zoom out"
- tapOn: "Zoom in"
- tapOn: "Zoom in"
- assertVisible: "Schedule"

# Schedule a weekly lesson for Amelia on Sunday at 9:00 AM (the default start).
# The date starts on today and the weekday comes from it, so this part assumes the flow runs on a Sunday
# (turning the date wheel isn't scripted yet).
- tapOn: "Add lesson"
- assertVisible: "Schedule lesson"
# Student is a dropdown: open it, then pick Amelia from the list.
- tapOn:
    text: "Student"
    index: 1                # the Student dropdown (index 0 is its label)
- tapOn: "Amelia Park"
- tapOn:
    text: "Off-ice"
    index: 0
# New lessons happen once until Repeat is on; then the Recurrence ends card slides open.
- scrollUntilVisible:
    element: "Repeat weekly"
- assertVisible: "One lesson on.*"
- tapOn: "Repeat weekly"
- assertVisible: "Recurrence ends"
- assertVisible: "Every Sunday at 9:00 AM.*"
- tapOn: "After X lessons"
- assertVisible: ".*\\(10 lessons\\).*"
# The stepper under the option changes the count; the summary above the buttons follows straight away.
- tapOn: "More lessons"
- assertVisible: ".*\\(11 lessons\\).*"
- tapOn: "No end date"
- tapOn:
    text: "Schedule lesson"
    index: 1
- assertNotVisible: "Every Sunday at 9:00 AM.*"

# Day view for Sunday shows the new lesson.
- tapOn: "Day"
- tapOn: "SUN.*"
- assertVisible: ".*Amelia.*"
# The card itself shows a clock and "45m"; its accessibility label also has the type.
- assertVisible: ".*Off-ice · 45m.*"

# Tapping the lesson opens the preview panel.
- tapOn: ".*Amelia.*"
- assertVisible: "Amelia Park"
- assertVisible: "Off-ice · Sunday 9:00 AM – 9:45 AM"
- assertVisible: "Add notes"

# Edit: change the type, and the preview stays open with the new type.
- tapOn: "Edit"
- assertVisible: "Edit lesson"
- tapOn:
    text: "Freestyle"
    index: 0
- tapOn: "Save changes"
- assertVisible: "Freestyle · Sunday 9:00 AM – 9:45 AM"
- tapOn: "Close preview"

# Double booking: Lily can't take the same Sunday 9:00 AM slot.
# (Same date and default start as Amelia's lesson.)
- tapOn: "Add lesson"
- tapOn:
    text: "Student"
    index: 1                # the Student dropdown (index 0 is its label)
- tapOn: "Lily Kim"
- tapOn:
    text: "Schedule lesson"
    index: 1
- assertVisible: "That time is taken"
- tapOn: "OK"

# The end time can't be typed: it follows the start and the length (45 min by default, then 60 min).
- assertVisible: "End time, 9:45 AM"
- tapOn: "60 min"
- assertVisible: "End time, 10:00 AM"
- tapOn: "Cancel"

# Delete from the preview asks first.
- tapOn: ".*Amelia.*"
- tapOn: "Delete lesson"
- assertVisible: "Delete lesson?"
- tapOn: "Delete"
- assertNotVisible: ".*Amelia.*"
