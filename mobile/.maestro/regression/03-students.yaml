# Students: filter, add (with the name check), add a discipline and level, edit (pencil on the profile card),
# delete, the profile's note cards with the "Go to notes center" link, and the Next lesson section's "Go to Calendar" link and "Schedule a lesson" button.
appId: host.exp.Exponent
name: Students add, edit, delete
tags: [regression]
---
- runFlow: ../subflows/start.yaml
- tapOn: "Students"

# Search and category filter.
- tapOn: "Search by student, discipline or level..."
- inputText: "Adult"
- assertVisible: ".*Noah Bennett.*"
- assertNotVisible: ".*Emma Miller.*"
- eraseText: 10
- pressKey: Enter
- assertVisible: ".*Emma Miller.*"

# Saving without a name shows an alert.
- tapOn: "Add student"
- assertVisible: "Disciplines and levels"
- tapOn: "Save student"
- assertVisible: "Add a name"
- tapOn: "OK"

# Add a student with one discipline.
- tapOn:
    text: "Student name"
    index: 1
- inputText: "Test Skater"
- pressKey: Enter
- tapOn:
    text: "Add a discipline"
    index: 1
- tapOn: "Learn to Skate · Learn to Skate"
- assertVisible: "Level"
# The phone keypad has no Return key, so type the number last; Save stays above the keyboard.
- tapOn:
    text: "Phone number"
    index: 1
- inputText: "5550102030"
- tapOn: "Save student"
- scrollUntilVisible:
    element: ".*Test Skater.*"
- assertVisible: ".*Test Skater.*Not scheduled.*"

# The detail sheet, then edit the name.
- tapOn: ".*Test Skater.*"
- assertVisible: "Training snapshot"
- assertVisible: ".*5550102030.*"   # the phone number on the navy card
- assertVisible: "Not started"
- scrollUntilVisible:
    element: "Go to notes center"
- assertVisible: "No lesson notes yet."
- tapOn: "Edit profile"   # the pencil on the blue card
- assertVisible: "Edit student"
- tapOn:
    text: "Student name"
    index: 1
- eraseText: 20
- inputText: "Test Edited"
- pressKey: Enter
- tapOn: "Save student"
- scrollUntilVisible:
    element: ".*Test Edited.*"
- assertNotVisible: ".*Test Skater.*"

# Delete asks first, then removes the student.
- scrollUntilVisible:
    element: ".*Test Edited.*"
- tapOn: ".*Test Edited.*"
- tapOn: "Edit profile"
- tapOn: "Delete"
- assertVisible: "Delete student\\?"
# The alert's Delete comes first in the screen tree; the sheet's own Delete button is second.
- tapOn:
    text: "Delete"
    index: 0
- assertNotVisible: ".*Test Edited.*"

# A student with notes shows them as cards. A card slides the note in over the profile (same sheet),
# Back slides it away again, Select ticks cards to share, and the link opens the Lessons tab filtered to that student.
- scrollUntilVisible:
    element: ".*Lily Kim.*"
- tapOn: ".*Lily Kim.*"
- scrollUntilVisible:
    element: "Go to notes center"
- tapOn: ".*Public · 45 minutes.*"
- assertVisible: "Save note"
- tapOn: "Back"
- assertVisible: "Go to notes center"
# Tick a card's circle: Select all and Share appear in the bar pinned to the bottom (Share opens the iOS share sheet, so the flow stops
# before it; the Text button never shows on the Simulator, which can't send texts). Select all, then Clear.
- assertNotVisible: "Select all"
- tapOn: "Select Public · 45 minutes.*"
- assertVisible: "1 of \\d+ selected"
- assertVisible: "Share"
- tapOn: "Select all"
- assertNotVisible: "1 of \\d+ selected"   # every card is ticked now
- tapOn: "Clear"
- assertNotVisible: "Select all"
- assertVisible: "Go to notes center"
- tapOn: "Go to notes center"
- assertVisible: "Filter by student name..."
- assertVisible: ".*Lily Kim.*"

# The profile's Next lesson section: "Schedule a lesson" opens the Calendar's lesson editor (Lily picked),
# and "Go to Calendar" shows her next lesson's week with its preview open.
- tapOn: "Students"
- scrollUntilVisible:
    element: ".*Lily Kim.*"
- tapOn: ".*Lily Kim.*"
- assertVisible: "Go to Calendar"
- tapOn: "Schedule a lesson"
- assertVisible: "Schedule lesson"
- tapOn: "Cancel"
- tapOn: "Students"
- scrollUntilVisible:
    element: ".*Lily Kim.*"
- tapOn: ".*Lily Kim.*"
- tapOn: "Go to Calendar"
- assertVisible: "Close preview"
- assertVisible: "Lily Kim"
- tapOn: "Close preview"
