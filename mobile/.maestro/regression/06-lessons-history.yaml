# Lessons tab: add a past lesson with notes, open and edit it, filter, select and delete.
appId: host.exp.Exponent
name: Lessons history
tags: [regression]
---
- runFlow: ../subflows/start.yaml
- tapOn: "Lessons"
- assertVisible: "Training history"
- assertVisible: "\\d+ lessons?"

# Add a past lesson for Sofia with a focus, an observation and a skill.
- tapOn: "Add a past lesson"
- assertVisible: "Add past lesson"
- assertVisible: "When"
- tapOn:
    text: "Student"
    index: 1                # the Student dropdown (index 0 is its label)
- tapOn: "Sofia Chen"
# Fields below the fold sit under the footer buttons, so scroll before tapping.
- scrollUntilVisible:
    element: "Skills, program sections, or goals covered..."
- tapOn:
    text: "Session focus"
    index: 1
- inputText: "UITEST spin entries"
- pressKey: Enter
# Scroll to the bottom so the skill box isn't hidden behind the footer buttons.
- scrollUntilVisible:
    element: "Include in student’s shared history"
- tapOn: "Add a skill, e.g. Axel"
- inputText: "Layback"
# Return adds the skill (same as the Add button next to the box).
- pressKey: Enter
- assertVisible: "Remove Layback"
- tapOn: "Save note"
- assertVisible: ".*Sofia Chen.*UITEST spin entries.*"

# Open it again: the note keeps what was typed.
- tapOn: ".*Sofia Chen.*UITEST spin entries.*"
- assertVisible: "Remove Layback"
- tapOn: "Close"

# Closing with the X after a change asks first (SKATE-84): Cancel keeps the editor open, Discard drops the change.
- tapOn: ".*Sofia Chen.*UITEST spin entries.*"
- scrollUntilVisible:
    element: "Include in student’s shared history"
- tapOn: "Add a skill, e.g. Axel"
- inputText: "Axel"
- tapOn: "Close"
- assertVisible: "Discard changes?"
- tapOn: "Cancel"
- assertVisible: "Save note"
- tapOn: "Close"
- tapOn: "Discard"
- assertVisible: "Training history"
- assertNotVisible: ".*Axel.*"

# Filter by student name and by time range.
- tapOn: "Filter by student name..."
- inputText: "Sofia"
- pressKey: Enter
- assertVisible: ".*UITEST spin entries.*"
- assertNotVisible: ".*Emma Miller.*"
- tapOn: "Filter by student name..."
- eraseText: 10
- pressKey: Enter
- tapOn: "This week"
- assertVisible: "\\d+ lessons?|No lessons match these filters\\."
- tapOn: "All"

# Tick the new entry's circle (Select all appears) and delete it.
- tapOn:
    text: "Select .*"
    leftOf: ".*UITEST spin entries.*"
- assertVisible: "Select all"
- assertVisible: "1 of \\d+ selected"
- tapOn:
    text: "Delete"
    index: 0
- assertVisible: "Delete 1 lesson\\?"
- tapOn:
    text: "Delete"
    index: 0
- assertNotVisible: ".*UITEST spin entries.*"
